name: agents-md
description: 验证增量代码是否符合 AGENTS.md 中定义的项目约束
priority: 1
mode: always
condition: ""
references:
  - path: AGENTS.md
    type: file
verify_focus: |
  检查增量代码是否违反 AGENTS.md 中的以下约束（按常见的 AGENTS.md 结构）：

  1. 禁止事项（NEVER 列表）：
     绝对禁止的操作、写法、依赖等。任何违反都是问题。

  2. 架构约束：
     模块边界、依赖方向、分层规则等。
     检查是否引入了禁止的跨模块依赖或违反分层。

  3. 编码约束：
     命名规范、指定的工具类/框架用法、禁止的 API 等。

  4. 高风险路径 / 禁区：
     涉及核心流程或敏感模块的改动，是否有配套措施（如回滚方案、灰度策略、额外 review）。

  5. 改完代码必做（自检清单）：
     是否遗漏了 AGENTS.md 中要求的自检项。

  注意：AGENTS.md 的具体结构因项目而异，以实际文件内容为准。
  上述仅为常见分类，子 agent 应以实际读到的 AGENTS.md 内容为依据。
verify_mode: |
  分级处理：
  - NEVER 列表 / 禁止事项 → 严格遵守，违反即为问题
  - 架构约束 → 严格遵守
  - 编码约束 → 严格遵守（明确禁止的写法）/ 参考遵守（建议性写法）
  - 高风险路径 → 触碰时检查是否有配套，缺失配套即为问题
  - 自检清单 → 逐项检查，遗漏即为问题
scope_filter: true
